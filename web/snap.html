<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opto Snapshot</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: radial-gradient(circle at 50% 45%, #1a2230, #0b0e13 75%);
    font-family: system-ui, sans-serif; color: #e8edf3; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #hud { position: fixed; left: 16px; top: 12px; font-size: 18px; font-weight: 600; z-index: 5; }
  #hud small { display: block; font-size: 12px; color: #9fb3c8; font-weight: 400; margin-top: 2px; }
  .opto-chip { font: 600 12.5px system-ui, sans-serif; padding: 3px 8px; border: 1.5px solid #1b1f24;
    border-radius: 4px; color: #1b1f24; white-space: nowrap; box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .opto-yellow { background: #f7e07b } .opto-pink { background: #f4a6c0 } .opto-green { background: #a3e4ad }
  .opto-blue { background: #a6cdf7 } .opto-orange { background: #f7bb7d } .opto-purple { background: #cdb6f4 }
  .opto-arrow-chip { background: rgba(10,14,20,.8); color: #cfe8ff; border-color: #4fc3f7 }
  .opto-leaders line { stroke: #e8edf3 } .opto-leaders circle { fill: #fff }
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud"></div>
<script type="module">
import { createViewer } from '/web/viewer.js';
const qs = new URLSearchParams(location.search);
// Keep the model and its labels clear of the title HUD in the top-left corner.
const viewer = createViewer(document.getElementById('stage'), { insets: { top: 64, bottom: 14, left: 14, right: 14 } });
let rec;
if (qs.get('forge')) {
  const id = encodeURIComponent(qs.get('forge'));
  const scene = await (await fetch(`/out/forge/${id}/scene.json?t=${Date.now()}`)).json();
  await viewer.loadForge(scene, `/out/forge/${id}/model.glb?t=${Date.now()}`);
  rec = { scene };
} else {
  const res = await fetch('/api/scene/' + encodeURIComponent(qs.get('scene')));
  rec = await res.json();
  viewer.load(rec.scene);
}
document.getElementById('hud').innerHTML =
  `${rec.scene.title}<small>${rec.scene.subtitle} · ${rec.scene.parts.length} parts</small>`;
if (qs.get('cut') === '1') setTimeout(() => viewer.setCut(true), 300);
if (qs.get('explode') === '1') setTimeout(() => viewer.setExplode(1), 300);
setTimeout(() => { document.title = 'ready'; }, 1500);
</script>
</body>
</html>
